name: Deploy Waste Scanner Function


on: 
  push:
    branches: [main]
    paths: 
      - "function/**"



permissions:
    id-token: write
    contents: read


env:
    RESOURCE_GROUP: rg-cost-governance-waste-detection
    WORKING_DIR: function/waste-scanner

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout repository
            uses: actions/checkout@v4


          - name: Set up Node.js
            uses: actions/setup-node@v4
            with:
                node-version: "20"
                cache: "npm"
                cache-dependency-path: ${{env.WORKING_DIR}}/package-lock.json


          - name: Install dependencies
            working-directory: ${{env.WORKING_DIR}}
            run: npm ci


          - name: Build Typescript
            working-directory: ${{env.WORKING_DIR}}
            run: npm run build


          - name: Remove dev dependencies before packaging
            working-directory: ${{env.WORKING_DIR}}
            run: npm prune --omit=dev

          - name: Azure login (OIDC)
            uses: azure/login@v2
            with: 
                client-id: ${{secrets.AZURE_CLIENT_ID}}
                tenant-id: ${{secrets.AZURE_TENANT_ID}}
                subscription-id: ${{secrets.AZURE_SUBSCRIPTION_ID}}


          - name: Resolve Function App name
            id: resolve
            run: |
              NAME=$(az functionapp list \
                --resource-group ${{env.RESOURCE_GROUP}} \
                --query "[0].name" -o tsv)
              echo "Resolved Function App: $NAME"
              echo "function_app_name=$NAME" >> "$GITHUB_OUTPUT"
              

          - name: Deploy to Azure Function App
            uses: Azure/functions-action@v1
            with:
                app-name: ${{ steps.resolve.outputs.function_app_name }}
                package: ${{env.WORKING_DIR}}
